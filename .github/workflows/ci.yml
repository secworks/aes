name: build-librelane-sky130
on:
  push:
  workflow_dispatch:

jobs:
  build-aes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # LibreLane selects the Sky130 PDK revision pinned in this release.
      - run: pip install librelane==3.0.6
      - run: librelane --docker-no-tty --dockerized --flow Classic data/sky130.yaml

  sim-icarus:
    runs-on: ubuntu-latest
    env:
      REPO : aes
      VLNV : secworks:crypto:aes
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          path: aes
      - run: sudo apt install iverilog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip3 install fusesoc==2.4.7 edalize==0.6.8
      - run: fusesoc library add $REPO $GITHUB_WORKSPACE/$REPO
      - run: fusesoc run --target=tb_aes $VLNV

  lint-verilator:
    runs-on: ubuntu-latest
    env:
      REPO : aes
      VLNV : secworks:crypto:aes
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          path: aes
      - run: sudo apt install verilator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip3 install fusesoc==2.4.7 edalize==0.6.8
      - run: fusesoc library add $REPO $GITHUB_WORKSPACE/$REPO
      - run: fusesoc run --target=lint $VLNV
